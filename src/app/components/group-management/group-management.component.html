@for (group of groups; track $index) {
    <div>
        <app-remove-button text="X" [keyToRemove]="group" (removeKey)="deleteGroup($event)"></app-remove-button>
        <span (click)="edit(group)">{{group}}</span>
    </div>
}
<div>
    <form [formGroup]="createGroupformGroup" (ngSubmit)="createGroup()">
        <label for="groupName">New group name:</label>
        <input type="text" formControlName="groupName" />
        <button type="submit" [disabled]="!createGroupformGroup.valid">Create!</button>
    </form>
</div>
